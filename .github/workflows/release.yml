name: Release

# Pousser un tag X.Y.Z, sans préfixe « v » (par exemple avec `npm version minor && git push --follow-tags`)
# construit l'image Docker, la publie sur GitHub Container Registry et crée la release GitHub.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # amd64 pour un serveur classique, arm64 pour un Raspberry Pi ou un NAS récent.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Créer la release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          cat > notes.md <<NOTES
          ## Image Docker

          \`\`\`sh
          docker pull $IMAGE:$TAG
          \`\`\`

          Voir [docs/docker.md](https://github.com/${{ github.repository }}/blob/$TAG/docs/docker.md) pour la lancer.
          NOTES
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --generate-notes

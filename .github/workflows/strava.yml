name: Synchronisation Strava

on:
  schedule:
    - cron: '17 5,17 * * *' # deux fois par jour (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: strava-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Récupérer les données Strava
        run: node scripts/fetch-strava.mjs data.json
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}

      # fetchedAt change à chaque exécution : on ne commite que si les sorties ou les totaux ont changé.
      - name: Publier data.json
        run: |
          if [ -n "$(git ls-files data.json)" ] && \
             [ "$(git show HEAD:data.json | grep -v '"fetchedAt"')" = "$(grep -v '"fetchedAt"' data.json)" ]; then
            echo "Aucune nouvelle donnée."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Met à jour les données Strava"
          git push
